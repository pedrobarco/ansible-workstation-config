---
- name: Install brew taps
  environment: "{{ dev_brew_env }}"
  community.general.homebrew_tap:
    name: "{{ item }}"
  loop: "{{ dev_brew_taps }}"

- name: Install brew formulae
  environment: "{{ dev_brew_env }}"
  community.general.homebrew:
    name: "{{ dev_brew_formulae }}"

- name: Install brew formulae (macOS only)
  environment: "{{ dev_brew_env }}"
  community.general.homebrew:
    name: "{{ dev_brew_formulae_darwin }}"
  when: ansible_facts["os_family"] == 'Darwin'

- name: Install npm global packages
  environment:
    PATH: "{{ dev_brew_path_env }}"
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    global: true
  loop: "{{ dev_npm_global_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install krew plugins
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.krew/bin:{{ dev_brew_path_env }}"
  block:
    # Run unconditionally: idempotent, and initializes the index so the
    # subsequent 'krew list' doesn't fail on a fresh machine.
    - name: Update krew index
      ansible.builtin.command: kubectl krew update
      changed_when: false

    - name: Get list of installed plugins
      ansible.builtin.shell:
        cmd: set -o pipefail && kubectl krew list | cut -f1
        executable: /bin/bash
      register: dev_installed_plugins
      changed_when: false

    - name: Install krew plugins
      ansible.builtin.command: "kubectl krew install {{ dev_krew_plugins | difference(dev_installed_plugins.stdout_lines) | join(' ') }}"
      when: dev_krew_plugins | difference(dev_installed_plugins.stdout_lines) | length > 0
      changed_when: true

- name: Install brew casks
  environment: "{{ dev_brew_env }}"
  community.general.homebrew_cask:
    name: "{{ dev_brew_casks }}"
  when: ansible_facts["os_family"] == 'Darwin'
