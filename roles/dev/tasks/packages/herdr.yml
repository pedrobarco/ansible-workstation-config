---
- name: Configure herdr plugins
  environment:
    PATH: "{{ dev_brew_path_env }}"
  block:
    - name: Get list of installed herdr plugins
      ansible.builtin.command: herdr plugin list --json
      register: dev_herdr_plugin_list
      changed_when: false

    - name: Build installed herdr plugin ids list
      ansible.builtin.set_fact:
        dev_herdr_installed_ids: >-
          {{ (dev_herdr_plugin_list.stdout | from_json).result.plugins
             | map(attribute='plugin_id') | list }}

    # `herdr plugin install` takes GitHub shorthand (owner/repo) but derives the
    # plugin id from the repo manifest, and that id can differ from the repo name
    # (e.g. herdr-worktrunk -> worktrunk). Gate on the declared plugin id to stay
    # idempotent regardless of the repo name.
    - name: Install herdr plugins
      ansible.builtin.command: "herdr plugin install {{ item.repo }} --yes"
      loop: "{{ dev_herdr_plugins }}"
      when: item.id not in dev_herdr_installed_ids
      changed_when: true
