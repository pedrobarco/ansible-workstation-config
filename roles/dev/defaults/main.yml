---
dev_dotfiles_repo: "https://github.com/pedrobarco/dotfiles.git"
dev_dotfiles_repo_version: master
dev_dotfiles_repo_accept_hostkey: false
dev_dotfiles_repo_local_destination: "{{ ansible_facts['env']['HOME'] }}/repos/pedrobarco/dotfiles"
dev_dotfiles_home: "{{ ansible_facts['env']['HOME'] }}"

# PATH with Homebrew (macOS) and Linuxbrew (Debian) bins first, for tasks that
# shell out to brew-installed binaries.
dev_brew_path_env: "/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"

# Environment for the homebrew tasks. NO_REQUIRE_TAP_TRUST opts out of the
# tap-trust gate (Homebrew >= 6.0) so formulae from dev_brew_taps load.
dev_brew_env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

# dev_brew_* and dev_krew_plugins are lists of strings; dev_npm_global_packages is a
# list of dicts (name + optional version) because community.general.npm needs them split.
dev_brew_taps:
  - hashicorp/tap
  - kcl-lang/tap

dev_brew_formulae:
  # core
  - bash
  - coreutils
  - curl
  - git
  - stow
  - xclip
  - zip
  - zsh
  # shell
  - antidote
  - starship
  # toolchains
  - bazelisk
  - go
  - kcl
  - node
  - python@3.13
  - rustup
  - hashicorp/tap/terraform
  # neovim
  - fd
  - fzy
  - neovim
  - ripgrep
  - tree-sitter-cli
  # tmux
  - fzf
  - herdr
  - tmux
  - tpm
  - worktrunk
  # dev
  - ansible
  - ansible-lint
  - buildozer
  - molecule
  - ibazel
  - jq
  - nmap
  - opencode
  - pre-commit
  - yq
  # media
  - mpv
  # containers
  - docker
  - krew
  - kubernetes-cli
  - kustomize
  - minikube

dev_brew_formulae_darwin:
  - telnet

dev_brew_casks:
  - alt-tab
  - docker-desktop
  - font-jetbrains-mono-nerd-font
  - font-space-mono-nerd-font
  - localsend
  - postman
  - rectangle
  - scroll-reverser
  - stremio
  - transmission
  - wezterm

dev_krew_plugins:
  - ctx
  - ns
  - print-env

# herdr plugins installed via `herdr plugin install <repo>`. `id` is the plugin
# id from the repo's manifest (used for idempotency and keybindings); it usually
# matches the repo basename but not always (e.g. herdr-worktrunk -> worktrunk).
dev_herdr_plugins:
  - { repo: paulbkim-dev/vim-herdr-navigation, id: vim-herdr-navigation }
  - { repo: pedrobarco/herdr-worktrunk, id: worktrunk }

dev_npm_global_packages:
  - name: "@augmentcode/auggie"
  - name: augment-open-proxy
    version: 1.0.3
  # dotagents manages agent skills declaratively via ~/.agents/agents.toml
  # (deployed from the dotfiles 'agents' stow package). Run `dotagents --user
  # install` manually to reconcile skills; Ansible only installs the CLI.
  - name: "@sentry/dotagents"
